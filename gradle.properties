# Settings for the Gradle build itself.

# Give the build enough memory.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (the modern Android libraries) instead of the old support library.
android.useAndroidX=true

# Kotlin code style used by the IDE formatter.
kotlin.code.style=official

# Each library's R class only contains its own resources (smaller, faster builds).
android.nonTransitiveRClass=true
