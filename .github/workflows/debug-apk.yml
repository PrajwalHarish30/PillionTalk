# Builds the debug APK on GitHub's servers after every push to main, and publishes it
# as the "latest-debug" release, so a phone can download it straight from GitHub:
#
#   https://github.com/PrajwalHarish30/PillionTalk/releases/download/latest-debug/PillionTalk-debug.apk
#
# GitHub Actions in one line: when something happens in the repo (a push), GitHub starts a
# fresh Linux machine, runs the steps below on it, then throws the machine away.

name: Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow running it by hand from the Actions tab

# Needed so the workflow can create and replace releases.
permissions:
  contents: write

# If you push twice quickly, cancel the older build: only the newest APK matters.
concurrency:
  group: debug-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching, so later builds are faster)
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk PillionTalk-debug.apk

      - name: Publish as the "latest-debug" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Pillion Talk v$VERSION, built from commit ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
            echo
            echo "On your phone, tap **PillionTalk-debug.apk** below and install it."
            echo "This is a debug build for testing. It's rebuilt automatically after every push."
          } > notes.md

          # Replace the previous release, so the download link always gives the newest build.
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug PillionTalk-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest debug build (v$VERSION)" \
            --notes-file notes.md
